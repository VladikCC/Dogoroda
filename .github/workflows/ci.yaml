name: Dogoroda CI

on:
  push:
    branches:
      - main
      - dev-a
      - dev-v

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    name: Code tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint dependencies
        run: python -m pip install flake8

      - name: lint backend
        run: |
          flake8 ./backend \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics \
          --exclude=backend/venv,.venv,venv,__pycache__

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=dogoroda_ci
          POSTGRES_PASSWORD=ci_only_password
          POSTGRES_DB=dogoroda_ci
          EOF

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T postgres_db \
              pg_isready -U dogoroda_ci -d dogoroda_ci; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          docker compose ps
          docker compose logs --no-color postgres_db
          exit 1

      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error \
              http://localhost:8000/openapi.json \
              -o /dev/null; then
              echo "Backend is responding"
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become ready"
          docker compose ps
          docker compose logs --no-color backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error \
              http://localhost:80/ -o /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 2
          done

          echo "Frontend did not become ready"
          docker compose ps
          docker compose logs --no-color frontend
          exit 1

      - name: Check frontend static JavaScript
        run: |
          curl --fail --silent --show-error \
            http://localhost:80/app.js -o /dev/null

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Stop services
        if: always()
        env:
            POSTGRES_USER: dogoroda_ci
            POSTGRES_PASSWORD: ci_only_password
            POSTGRES_DB: dogoroda_ci
        run: docker compose down --remove-orphans
